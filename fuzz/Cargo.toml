[package]
name = "walflip-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.walflip]
path = ".."
features = ["testing"]

# Same version as walflip's, so `Connection` is one type; `limits` is for the exec_sql sandbox.
[dependencies.rusqlite]
version = "0.32"
features = ["bundled", "hooks", "limits"]

[dependencies.arbitrary]
version = "1"
features = ["derive"]

[[bin]]
name = "wal_parse"
path = "fuzz_targets/wal_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_differential"
path = "fuzz_targets/wal_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_apply"
path = "fuzz_targets/replay_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_capture"
path = "fuzz_targets/store_capture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "statements_split"
path = "fuzz_targets/statements_split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec_sql"
path = "fuzz_targets/exec_sql.rs"
test = false
doc = false
bench = false

[package]
name = "walflip-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.walflip]
path = ".."
features = ["testing"]

[[bin]]
name = "wal_parse"
path = "fuzz_targets/wal_parse.rs"
test = false
doc = false
bench = false

[dependencies.arbitrary]
version = "1"
features = ["derive"]

[[bin]]
name = "wal_differential"
path = "fuzz_targets/wal_differential.rs"
test = false
doc = false
bench = false

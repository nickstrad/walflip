name: fuzz-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  fuzz:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Revisit when 24.04 nears EOL or on a deliberate bump.
    runs-on: ubuntu-24.04
    env:
      # Fuzzing only: bundled SQLite without fsync (exec_sql hit the 30 s libFuzzer timeout stuck in fsync).
      LIBSQLITE3_FLAGS: -DSQLITE_NO_SYNC
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [wal_parse, wal_differential, replay_apply, store_capture, statements_split, exec_sql]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: |
          extra=""
          if [ "${{ matrix.target }}" = wal_parse ]; then extra="-max_len=70000"; fi
          if [ "${{ matrix.target }}" = exec_sql ]; then extra="-timeout=30"; fi
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=1024 -dict=fuzz/wal.dict $extra
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/**

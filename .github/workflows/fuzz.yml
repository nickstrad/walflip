name: fuzz-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target: [wal_parse, wal_differential, replay_apply, store_capture, statements_split]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: |
          extra=""
          if [ "${{ matrix.target }}" = wal_parse ]; then extra="-max_len=70000"; fi
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=1024 -dict=fuzz/wal.dict $extra
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/**

name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Revisit when 24.04 nears EOL or on a deliberate bump.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features testing
  fuzz-build-replay:
    # Pinned runner, see the note on the test job.
    runs-on: ubuntu-24.04
    env:
      # Fuzz crate only (fuzz/ is its own workspace): no fsync, avoids libFuzzer timeouts. Not set in the test job.
      LIBSQLITE3_FLAGS: -DSQLITE_NO_SYNC
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
      - name: Replay committed corpora
        run: |
          for t in wal_parse wal_differential replay_apply store_capture statements_split exec_sql; do
            extra=""
            if [ "$t" = wal_parse ]; then extra="-max_len=70000"; fi
            cargo +nightly fuzz run "$t" "fuzz/corpus/$t" -- -runs=0 -rss_limit_mb=1024 -dict=fuzz/wal.dict $extra
          done

name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Revisit when 24.04 nears EOL or on a deliberate bump.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features testing
